name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # The web typecheck runs `next typegen` first, so route types such as
      # LayoutProps exist on a clean checkout.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Does not scrape UMD sites: every data page awaits connection() before
      # fetching, so those routes render at request time, not during the build.
      - name: Build
        run: npm run build
